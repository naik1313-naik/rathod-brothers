<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Technical illustration of a tipper truck">
  <title>Tipper truck — technical illustration (placeholder imagery)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2c48"/>
      <stop offset="58%" stop-color="#123a5c"/>
      <stop offset="100%" stop-color="#0a2237"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#d99a06"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20303d"/>
      <stop offset="100%" stop-color="#101a23"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fb6d8"/>
      <stop offset="100%" stop-color="#2b5c7d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- road -->
  <rect y="590" width="1200" height="210" fill="#0a1c2c"/>
  <path d="M0 590 H1200" stroke="#f5c518" stroke-opacity="0.3" stroke-width="2"/>
  <g stroke="#f5c518" stroke-opacity="0.22" stroke-width="6" stroke-dasharray="46 40">
    <path d="M0 700 H1200"/>
  </g>

  <!-- skyline -->
  <g fill="#0e2740" opacity="0.8">
    <rect x="60" y="420" width="120" height="170"/>
    <rect x="1020" y="450" width="140" height="140"/>
  </g>

  <!-- ================= TIPPER TRUCK ================= -->
  <g transform="translate(150 150)">
    <!-- wheels -->
    <g>
      <circle cx="150" cy="470" r="76" fill="url(#dark)" stroke="#3c4f5e" stroke-width="4"/>
      <circle cx="150" cy="470" r="30" fill="#0a1117" stroke="#4a5f6e" stroke-width="3"/>
      <g stroke="#4a5f6e" stroke-width="4">
        <path d="M150 440 V500 M120 470 H180 M129 449 L171 491 M171 449 L129 491"/>
      </g>
      <circle cx="500" cy="470" r="76" fill="url(#dark)" stroke="#3c4f5e" stroke-width="4"/>
      <circle cx="500" cy="470" r="30" fill="#0a1117" stroke="#4a5f6e" stroke-width="3"/>
      <g stroke="#4a5f6e" stroke-width="4">
        <path d="M500 440 V500 M470 470 H530 M479 449 L521 491 M521 449 L479 491"/>
      </g>
      <circle cx="700" cy="470" r="76" fill="url(#dark)" stroke="#3c4f5e" stroke-width="4"/>
      <circle cx="700" cy="470" r="30" fill="#0a1117" stroke="#4a5f6e" stroke-width="3"/>
      <g stroke="#4a5f6e" stroke-width="4">
        <path d="M700 440 V500 M670 470 H730 M679 449 L721 491 M721 449 L679 491"/>
      </g>
    </g>

    <!-- chassis -->
    <rect x="40" y="396" width="760" height="30" rx="6" fill="#16232e" stroke="#3d5464" stroke-width="3"/>

    <!-- tipper body (tipped slightly, loaded) -->
    <g>
      <path d="M360 300 L790 300 L760 396 L392 396 Z" fill="url(#bodyG)" stroke="#a87c05" stroke-width="4"/>
      <path d="M360 300 L790 300 L782 330 L368 330 Z" fill="#ffffff" fill-opacity="0.18"/>
      <!-- ribs -->
      <g stroke="#a87c05" stroke-width="4" opacity="0.8">
        <path d="M430 306 L446 392 M500 306 L508 392 M570 306 L570 392 M640 306 L632 392 M710 306 L694 392"/>
      </g>
      <!-- load -->
      <path d="M392 300 q60-56 128-30 q70 26 132-16 q60-40 120 22 q-8 24-16 24 Z" fill="#2a3f2c"/>
      <path d="M420 300 q50-40 104-22 q56 20 110-10 q48-26 92 12 Z" fill="#38512f" opacity="0.85"/>
      <!-- tailgate -->
      <path d="M392 396 L364 396 L376 440 L404 440 Z" fill="#8d6a10" stroke="#a87c05" stroke-width="3"/>
    </g>

    <!-- cab -->
    <g>
      <path d="M96 396 V216 a12 12 0 0 1 12-12 H268 a12 12 0 0 1 12 12 V396 Z"
            fill="url(#dark)" stroke="#4a6274" stroke-width="3"/>
      <!-- windshield -->
      <path d="M120 226 H272 V300 H120 Z" fill="url(#glass)"/>
      <path d="M120 226 L176 226 L120 268 Z" fill="#ffffff" fill-opacity="0.2"/>
      <!-- side window -->
      <path d="M286 232 H346 V310 H286 Z" fill="url(#glass)"/>
      <path d="M286 232 H346 V310 H286 Z" fill="#ffffff" fill-opacity="0.08"/>
      <!-- door line + handle -->
      <path d="M280 220 V392" stroke="#3d5464" stroke-width="2"/>
      <rect x="292" y="330" width="34" height="9" rx="4" fill="#f5c518" fill-opacity="0.85"/>
      <!-- grille + lights -->
      <rect x="96" y="316" width="42" height="46" rx="5" fill="#16232e" stroke="#3d5464" stroke-width="2"/>
      <g stroke="#f5c518" stroke-opacity="0.5" stroke-width="2">
        <path d="M100 328 H134 M100 340 H134 M100 352 H134"/>
      </g>
      <rect x="100" y="374" width="36" height="14" rx="4" fill="#ffe9a3"/>
      <!-- exhaust stack -->
      <rect x="356" y="150" width="20" height="246" rx="6" fill="#243545" stroke="#46596a" stroke-width="3"/>
      <!-- beacon -->
      <circle cx="196" cy="196" r="9" fill="#f5c518">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <!-- brand plate -->
      <text x="196" y="380" font-family="monospace" font-size="24" font-weight="700"
            fill="#f5c518" text-anchor="middle" letter-spacing="4">RATHOD</text>
    </g>

    <!-- mudflap + fuel tank -->
    <path d="M726 396 h48 l-8 44 h-32 z" fill="#16232e" stroke="#3d5464" stroke-width="2"/>
    <rect x="286" y="352" width="52" height="44" rx="8" fill="#243545" stroke="#46596a" stroke-width="3"/>
  </g>

  <!-- motion lines -->
  <g stroke="#f5c518" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <path d="M40 470 H180"/>
    <path d="M20 512 H140"/>
    <path d="M70 554 H200"/>
  </g>

  <text x="600" y="762" font-family="monospace" font-size="20" letter-spacing="6"
        fill="#f5c518" fill-opacity="0.7" text-anchor="middle">TIPPER // TRANSPORT</text>
  <text x="1140" y="762" font-family="monospace" font-size="16" letter-spacing="2"
        fill="#ffffff" fill-opacity="0.4" text-anchor="end">PLACEHOLDER VISUAL</text>
</svg>
